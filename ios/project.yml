name: Ladeplanung
options:
  bundleIdPrefix: de.sliebeltprivate
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  Ladeplanung:
    type: application
    platform: iOS
    sources:
      - path: Ladeplanung
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.sliebeltprivate.ladeplanung
        INFOPLIST_KEY_CFBundleDisplayName: Ladeplanung
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Die App verbindet sich mit der Ladeplanung im Heimnetz."
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
        TARGETED_DEVICE_FAMILY: "1"
